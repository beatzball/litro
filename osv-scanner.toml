# osv-scanner configuration for the Dependency Audit CI check.
#
# Replaces `pnpm audit --audit-level high`, whose npm endpoint npm retired
# (HTTP 410). osv-scanner scans the lockfile against the OSV database with no
# dependency on that endpoint.
#
# Fixable advisories are FIXED, not listed here. js-yaml GHSA-2883-xcg3-v3hh
# was resolved by bumping the existing pnpm overrides to ^3.15.2 / ^4.3.2 — a
# patch on each line — rather than adding two more entries below.
#
# The entries below baseline the advisories present when this gate was
# introduced. Most are either a dev/tooling dependency that is NOT shipped in
# any published @beatzball package, or a transitive advisory below the `high`
# severity bar the previous audit enforced. A NEW advisory is not listed here
# and will fail the check.
#
# TWO entries do not fit either reason: node-forge GHSA-86w9-cpqp-85rv and
# braces GHSA-vfj7-8cjw-p6xm are both High AND reach published packages in
# production. They share a section at the bottom, each with its own
# justification and tracking issue, so that "dev-only" never has to be claimed
# about a package that ships. Keep that distinction: an entry whose reason is
# not true is worse than no gate at all.

# --- Dev / tooling only (never shipped to users) ---

[[IgnoredVulns]]
id = "GHSA-5xrq-8626-4rwp" # vitest 2.1.9 (Critical)
reason = "vitest is a dev/test-only dependency; not a production dependency of any published @beatzball package, so it never ships to users."

[[IgnoredVulns]]
id = "GHSA-g7r4-m6w7-qqqr" # esbuild 0.27.3
reason = "esbuild is a dev/build-only tool (via vite/vitest); not shipped in any published package."

[[IgnoredVulns]]
id = "GHSA-jmr9-qjv8-65gv" # extract-zip 2.0.1 (High, CVSS 8.6)
reason = "No fixed version exists upstream as of 2026-08-21. Dev/benchmark-only: the sole path is @beatzball/litro-benchmarks (a PRIVATE workspace) -> lighthouse -> puppeteer-core -> @puppeteer/browsers -> extract-zip, so it never ships to users. Verified with `pnpm why -r extract-zip`, which reports that workspace and no other. Revisit when @puppeteer/browsers ships a patched extract-zip."

[[IgnoredVulns]]
id = "GHSA-82fw-gwwq-j7x9" # vitest / @vitest/mocker 2.1.9 (Medium, CVSS 5.9)
reason = "vitest is a dev/test-only dependency; not a production dependency of any published @beatzball package, so it never ships to users. Verified: none of the four published packages (@beatzball/litro, -router, -agent, create-litro) lists vitest under `dependencies`. The fix is vitest 4.1.11, a MAJOR bump from the 2.x this repo pins — that is a test-infrastructure migration, not a security patch, and it is tracked separately rather than smuggled into an audit fix. Revisit when the repo moves to vitest 4."

[[IgnoredVulns]]
id = "GHSA-7pqw-9j4j-h8q3" # extract-zip 2.0.1 (High, CVSS 8.1)
reason = "No fixed version exists upstream as of 2026-09-13 (the advisory lists no patched release). Same package and same sole path as GHSA-jmr9-qjv8-65gv above: @beatzball/litro-benchmarks (a PRIVATE workspace) -> lighthouse -> puppeteer-core -> @puppeteer/browsers -> extract-zip, confirmed with `pnpm why -r extract-zip`, which reports that workspace and no other. Never ships to users. Revisit when @puppeteer/browsers ships a patched extract-zip."

[[IgnoredVulns]]
id = "GHSA-w5hq-g745-h8pq" # uuid 8.3.2 (High)
reason = "uuid is a dev/benchmark transitive dependency; not a production dependency of any published package, so it never ships to users."

# --- Transitive, below the enforced `high` severity bar (Medium/Low) ---
#
# Entries here are removed once a dependency bump resolves them: osv-scanner
# reports unused ignores, and a stale ignore can mask a genuine future
# reintroduction of the same advisory.

[[IgnoredVulns]]
id = "GHSA-8988-4f7v-96qf" # @opentelemetry/core 1.30.1
reason = "Transitive tooling dependency (not a direct production dependency of any published package); Medium severity, below the high threshold this audit enforces."

[[IgnoredVulns]]
id = "GHSA-qqmp-wf37-98f9" # @opentelemetry/instrumentation-* 0.18.1 - 0.51.1 (Medium, CVSS 5.8)
reason = "Medium severity, below the high threshold this audit enforces, and dev/benchmark-only. One advisory covers six installed packages (instrumentation-knex, -mongoose, -mysql, -mysql2, -pg, -tedious); `pnpm why -r @opentelemetry/instrumentation-pg` reports a single path for all of them, @beatzball/litro-benchmarks (a PRIVATE workspace) -> lighthouse 12.8.2 -> @sentry/node 9.47.1, so none of them ships to users. The issue is an unconditional `db.user` span attribute (CWE-532, information exposure through a log), which needs a database instrumented through @sentry/node to matter; this repo instruments no database. Each package has a fixed release, but every one is a MAJOR-series jump pinned by @sentry/node 9.47.1, so six overrides would fight that pin for a Medium in a private benchmark workspace. Revisit when @sentry/node bumps its OpenTelemetry instrumentation range."

[[IgnoredVulns]]
id = "GHSA-hp3w-g68c-fv3c" # sprintf-js 1.0.3 (Medium, CVSS 6.9)
reason = "Medium severity, below the high threshold this audit enforces. Unlike the other entries in this section it DOES reach published packages in production, so do not read it as dev-only: `pnpm why --prod sprintf-js --filter @beatzball/litro` reports @beatzball/litro -> gray-matter 4.0.3 -> js-yaml 3.15.2 -> argparse 1.0.10 -> sprintf-js 1.0.3, and @beatzball/litro-agent reaches it through @beatzball/litro. No fixed version exists upstream as of 2026-10-10: the advisory is `last_affected` 1.1.3 with no `fixed` event, and 1.1.3 is the newest published release. No bump removes the path either: gray-matter 4.0.3 is `latest` and pins js-yaml to 3.x, which this repo already overrides to the patched ^3.15.2, and argparse 1.x always requires sprintf-js. Exposure is limited: the advisory is unbounded precision specifiers in a format string, and the only caller is argparse's command-line help and error formatting with argparse's own hardcoded format strings. Revisit when gray-matter moves to js-yaml 4, or when sprintf-js ships a fix."

# --- Production path, no upstream fix (NOT dev-only) ---
#
# Read the reason below before adding anything to this section. It is the only
# place in this file where a filtered advisory does reach a user, and it is
# filtered because there is nothing to bump to — not because it is harmless.

[[IgnoredVulns]]
id = "GHSA-86w9-cpqp-85rv" # node-forge 1.4.0 (High, CVSS 8.7)
reason = "No fixed version exists upstream as of 2026-10-02: node-forge 1.4.0 IS the latest published release, and the advisory lists no patched version (last_affected 1.4.0, no fixed event). This entry is NOT dev-only, unlike the others above: node-forge reaches published packages as a transitive PRODUCTION dependency. `pnpm why --prod node-forge --filter @beatzball/litro` reports @beatzball/litro -> nitropack 2.13.4 -> listhen 1.10.0 -> node-forge 1.4.0, and @beatzball/litro-agent reaches it by the same path. No bump removes the path: nitropack 2.13.4 is the current `latest` tag, and listhen 1.10.1 (latest) still declares node-forge ^1.4.0; Nitro v3 is deferred while it is still beta, so it is not the route here. Exposure is limited, with evidence: the advisory is RSA PKCS#1 v1.5 signature VERIFICATION forgery (CWE-347), and listhen uses node-forge only to generate and sign a self-signed certificate for the dev server's HTTPS option — there is no `verify` call anywhere in listhen's built output, so the vulnerable path is never entered — while a production `litro build` emits a Nitro server that references neither node-forge nor listhen and does not list node-forge in its generated runtime dependencies. Tracked in issue 229, which carries the full assessment. Revisit when node-forge ships a fix, or when listhen or nitropack drops the dependency."

[[IgnoredVulns]]
id = "GHSA-vfj7-8cjw-p6xm" # braces 3.0.3 (High, CVSS 8.7)
reason = "No fixed version exists upstream as of 2026-10-10: braces 3.0.3 IS the latest published release (`npm view braces versions` ends at 3.0.3) and the advisory lists no patched version (last_affected 3.0.3, no fixed event, not withdrawn, last modified 2026-10-02). The upstream fix pull request was closed and the follow-up maxDepth proposal withdrawn. Like node-forge above, this entry is NOT dev-only: braces reaches published packages as a transitive PRODUCTION dependency by TWO independent paths, so dropping our direct dependency would achieve nothing. `pnpm why --prod braces --filter @beatzball/litro` reports both: @beatzball/litro -> fast-glob 3.3.3 (our direct production dependency) -> micromatch 4.0.8 -> braces 3.0.3, AND @beatzball/litro -> nitropack 2.13.4 -> globby 16.2.2 -> fast-glob -> micromatch -> braces. @beatzball/litro-agent reaches it by three paths (its own direct fast-glob plus both of those); @beatzball/litro-router and @beatzball/create-litro do not reach it at all. No bump escapes it, because every link is already at its latest tag: braces 3.0.3, micromatch 4.0.8 (declares braces ^3.0.3), fast-glob 3.3.3 (declares micromatch ^4.0.8) and nitropack 2.13.4 are all `latest`, no nitropack 3.x is published, nitropack declares globby ^16.2.0, and globby 16.2.4 (latest) still declares both fast-glob and micromatch. Exposure is limited, with evidence: the advisory is stack exhaustion from ATTACKER-SUPPLIED deeply nested brace patterns (CWE-674), and there is no path for one. Every pattern Litro passes to fast-glob is a hardcoded literal in framework source — `**/*.{ts,tsx}` in plugins/pages and plugins/ssg, `**/*.server.{ts,tsx,js,mjs}` in plugins/actions, `**/*.md` and `**/*.markdown` in content/index, the `APP_FILE_GLOB` constant in cli/mcp-app, and `tools/*.ts` plus `agents/*/agent.ts` in litro-agent's plugin — so nothing reads a pattern from a request, a user config or any untrusted input (a directory path is passed as `cwd`, which is not a brace pattern). Every one of those call sites is build-time, and the shipped runtime does not contain the dependency at all: `grep -rl fast-glob packages/framework/dist/runtime/` matches none of its 23 built files, and the only mentions in dist/index.js and dist/vite/index.js are source comments rather than imports. The advisory is also DISPUTED upstream by engineers other than the maintainer: github/advisory-database pull request 10132 (open, filed 2026-10-03) proposes marking no version as affected, the technical argument on micromatch/braces issue 73 is that the report overstates the impact because braces can already throw on untrusted input and so grants no new capability, and the CNA has been emailed asking for a withdrawal. Tracked in issue 231, which carries the full assessment. Revisit when advisory-database pull request 10132 lands or the CNA withdraws the advisory — either deletes this entry with no code change — or when braces ships a fix, or when micromatch drops braces. A third-party patched fork exists and is deliberately NOT used: pointing a published framework at a stranger's fork of an unmaintained package trades an unreachable theoretical risk for a real supply-chain one."
