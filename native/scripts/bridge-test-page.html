<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Litro bridge test</title>
<style>
  :root { color-scheme: dark; }
  body { font: 16px/1.5 -apple-system, system-ui, sans-serif; margin: 0; padding: 24px;
         background: #0d0d10; color: #e8e8ea; }
  h1 { font-size: 19px; margin: 0 0 16px; }
  pre { background: #000; border: 1px solid #26262c; border-radius: 10px; padding: 12px;
        white-space: pre-wrap; word-break: break-word; font-size: 13px; margin: 0 0 16px; }
  button { font: 600 15px -apple-system, system-ui, sans-serif; margin: 0 8px 8px 0;
           padding: 11px 15px; border: 0; border-radius: 10px; background: #2f6feb; color: #fff; }
  button:disabled { background: #2a2a31; color: #6a6a74; }
  .ok { color: #4ad07a; } .bad { color: #ff6b6b; } .warn { color: #f0b429; }
</style>
</head>
<body>
<h1>Litro bridge test</h1>
<pre id="log">starting</pre>
<div id="controls"></div>

<script>
// A hand-written stand-in for the page-side transport that Phase 5 brings.
// Deliberately small: it exists to exercise the shell, not to be the real thing.
const log = document.getElementById('log');
const lines = [];
function say(text, kind) {
  lines.push(kind ? `<span class="${kind}">${text}</span>` : text);
  log.innerHTML = lines.join('\n');
  // Each line is also requested from the serving script, so its terminal
  // carries the whole report. The share sheet covers this log, and a run
  // nobody is watching still has to be read. The 404 is expected.
  fetch('/__log?' + encodeURIComponent((kind ? kind.toUpperCase() + ' ' : '') + text),
    { cache: 'no-store' }).catch(() => {});
}

const shell = window.__litroNative;
if (!shell) {
  say('no shell: this is a plain browser', 'bad');
} else {
  say('shell present, version ' + shell.version, 'ok');
}

let nextId = 1;
const pending = new Map();

if (shell) {
  // The shell injects only { version }. The page owns `receive`.
  shell.receive = (reply) => {
    const entry = pending.get(reply.id);
    if (!entry) return say('reply for an unknown id ' + reply.id, 'bad');
    pending.delete(reply.id);
    clearTimeout(entry.timer);
    entry.resolve(reply);
  };
}

function call(method, params, timeoutMs) {
  return new Promise((resolve, reject) => {
    const id = String(nextId++);
    const timer = setTimeout(() => {
      pending.delete(id);
      reject(new Error('timeout after ' + timeoutMs + 'ms'));
    }, timeoutMs);
    pending.set(id, { resolve, timer });
    const request = { jsonrpc: '2.0', id, method };
    if (params) request.params = params;
    window.webkit.messageHandlers.litroNative.postMessage(request);
  });
}

async function show(label, method, params, timeoutMs = 10000) {
  try {
    const reply = await call(method, params, timeoutMs);
    const text = 'error' in reply
      ? `error ${reply.error.code} ${reply.error.message}`
      : 'result ' + JSON.stringify(reply.result);
    say(`${label} -> ${text}`, 'error' in reply ? 'bad' : 'ok');
  } catch (error) {
    say(`${label} -> ${error.message}`, 'bad');
  }
}

const buttons = [
  ['handshake', () => show('handshake', 'handshake', undefined, 2000)],
  ['impact', () => show('haptics.impact', 'haptics.impact', { style: 'medium' })],
  ['notify', () => show('haptics.notify', 'haptics.notify', { type: 'success' })],
  ['selection', () => show('haptics.selection', 'haptics.selection')],
  ['badge 3', () => show('badging.set', 'badging.set', { count: 3 })],
  ['badge clear', () => show('badging.clear', 'badging.clear')],
  ['bad style', () => show('bad style', 'haptics.impact', { style: 'rumble' })],
  ['bad count', () => show('bad count', 'badging.set', { count: -1 })],
  ['unknown method', () => show('unknown method', 'haptics.rumble')],
  // Share and review need a person and a real device. Every way the sheet
  // closes answers differently: pick a target and finish, or close it, and
  // both should say `result null`; a target that fails says `error -32603`.
  // On an iPad the sheet must open centered rather than stop the app.
  ['share text', () => show('share', 'share', { title: 'Litro', text: 'Shared from the bridge test page' }, 120000)],
  ['share link', () => show('share', 'share',
    { title: 'Litro', url: location.origin + '/' }, 120000)],
  // The second call arrives while the first sheet is open and must be refused
  // at once with error -32603, not wait out its budget.
  ['share twice', () => {
    show('share (first)', 'share', { text: 'first' }, 120000);
    show('share (second)', 'share', { text: 'second' }, 10000);
  }],
  // Always `result null`, at once. In a development build the prompt appears
  // (and does nothing); in a TestFlight build it never does. Neither changes
  // the answer, because the system does not tell the app.
  ['request review', () => show('requestReview', 'requestReview', undefined, 10000)],
  // Notifications. The first tap on a fresh install shows the permission
  // prompt, so these use the interactive budget the page itself uses, and
  // send it as budgetMs as the page adapter does. Half a second checks that a
  // reminder under a second away still fires.
  ['notify in 0.5s', () => scheduleIn(0.5)],
  ['notify in 5s', () => scheduleIn(5)],
  ['notify in 10s', () => scheduleIn(10)],
  ['cancel last', () => show('notifications.cancel', 'notifications.cancel', { id: lastNotificationId })],
  // Secure storage. Write, force-quit the app, open it again, read: the value
  // must still be there. That is the check only a device can make.
  ['keychain write', () => show('secureStorage.set', 'secureStorage.set',
    { key: 'bridge-test', value: 'written ' + new Date().toISOString() })],
  ['keychain read', () => show('secureStorage.get', 'secureStorage.get', { key: 'bridge-test' })],
  ['keychain remove', () => show('secureStorage.remove', 'secureStorage.remove', { key: 'bridge-test' })],
];

// The id of the last notification scheduled, so `cancel last` has one to send.
let lastNotificationId = '';

async function scheduleIn(seconds) {
  const label = `notifications.schedule +${seconds}s`;
  try {
    const reply = await call('notifications.schedule',
      { title: 'Litro bridge test', body: `Scheduled ${seconds}s ago`, at: Date.now() + seconds * 1000,
        budgetMs: 120000 },
      120000);
    if ('error' in reply) {
      say(`${label} -> error ${reply.error.code} ${reply.error.message}`, 'bad');
      return;
    }
    lastNotificationId = reply.result;
    say(`${label} -> result ${JSON.stringify(reply.result)}`, 'ok');
  } catch (error) {
    say(`${label} -> ${error.message}`, 'bad');
  }
}

const controls = document.getElementById('controls');
for (const [label, run] of buttons) {
  const button = document.createElement('button');
  button.textContent = label;
  button.disabled = !shell;
  button.addEventListener('click', run);
  controls.appendChild(button);
}

// The checks that need nobody run by themselves, in order, so a screenshot
// taken after launch is a whole report rather than one line. The ones that put
// something in front of a person -- the badge permission prompt, the share
// sheet and the review prompt -- stay on their buttons.
// Proves the shell's origin allowlist is actually wired to the web view.
//
// Worth its own check because the failure is silent: a navigation delegate
// method whose signature only nearly matches the protocol compiles, warns once,
// and is never called. Nothing else here would notice, because every other
// check loads an allowed origin.
//
// The destination must be REACHABLE, and that is the whole difficulty. An
// earlier version navigated to a `.invalid` host, which never resolves. The
// navigation failed on its own and the page stayed put, so the check reported
// "refused the outside origin" whether or not any allowlist existed -- verified
// by running it against a web view with no navigation delegate at all. It could
// not detect the one trap it was written for.
//
// So the destination is the second server that serve-test-page.sh runs, one
// port up from this one: same host, reachable, and a different origin, which is
// what the allowlist is being asked about. If the allowlist is not wired, the
// browser goes there and that page says so in large red text -- this page is
// gone by then, so it cannot report its own failure.
//
// An unreachable probe is reported as SKIPPED. A check that cannot run is not
// a check that passed.
async function checkOriginPolicy() {
  const here = location.origin;
  const probe = location.protocol + '//' + location.hostname + ':'
    + (Number(location.port) + 1) + '/';
  try {
    // Opaque by design: this asks only whether something answers there.
    await fetch(probe, { mode: 'no-cors', cache: 'no-store' });
  } catch (error) {
    say('origin policy -> SKIPPED, nothing answers at ' + probe, 'warn');
    return;
  }
  location.assign(probe);
  await new Promise((resolve) => setTimeout(resolve, 2000));
  const stayed = location.origin === here;
  say('origin policy -> ' + (stayed ? 'refused the outside origin' : 'DID NOT BLOCK'),
      stayed ? 'ok' : 'bad');
}

// Presentation needs nobody, only the outcome does. The first version of the
// share module answered "could not be shown" to every share while the sheet
// appeared, because it judged presentation on the line after an animated
// present. So this asks for a sheet and expects NO answer for three seconds:
// an answer that early can only be a wrong one. The sheet then stays up for a
// person to close, and its answer is printed when they do.
async function checkSharePresents() {
  let answered = null;
  call('share', { title: 'Litro', text: 'Unattended presentation check' }, 600000)
    .then((reply) => {
      answered = reply;
      const text = 'error' in reply
        ? `error ${reply.error.code} ${reply.error.message}` : 'result ' + JSON.stringify(reply.result);
      say('share (unattended) closed -> ' + text, 'error' in reply ? 'bad' : 'ok');
    })
    .catch((error) => say('share (unattended) -> ' + error.message, 'bad'));
  await new Promise((resolve) => setTimeout(resolve, 3000));
  if (answered && 'error' in answered) {
    say('share presents -> FAILED, answered before anyone could close it', 'bad');
  } else if (answered) {
    say('share presents -> answered within 3 s; was the sheet closed by hand?', 'warn');
  } else {
    say('share presents -> sheet on screen, no answer yet (close it to see the answer)', 'ok');
  }
}

async function runUnattended() {
  await show('handshake', 'handshake', undefined, 2000);
  await show('haptics.impact', 'haptics.impact', { style: 'medium' });
  await show('haptics.notify', 'haptics.notify', { type: 'success' });
  await show('haptics.selection', 'haptics.selection');
  await show('bad style', 'haptics.impact', { style: 'rumble' });
  await show('bad count', 'badging.set', { count: -1 });
  await show('unknown method', 'haptics.rumble');
  // canShare opens nothing, so it runs here. With the share module compiled
  // in: a link says true, a payload `share` would refuse says false.
  await show('canShare link', 'canShare', { url: location.origin + '/' });
  await show('canShare empty', 'canShare', {});
  await show('canShare javascript: url', 'canShare', { url: 'javascript:void 0' });
  // Refused before any sheet opens, so it needs nobody: error -32602.
  await show('share bad url', 'share', { url: '/relative' });
  await checkOriginPolicy();
  await checkSharePresents();
  say('unattended checks done');
}

if (shell) runUnattended();
</script>
</body>
</html>
