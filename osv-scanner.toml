id = "GHSA-mrhx-c7xc-m3w5" # zod 3.25.76 (High, CVSS 8.2) -- the 3.x copy only; the 4.x copy is FIXED by the `zod@4` override
reason = "Dev/benchmark-only: the sole path to zod 3.x is @beatzball/litro-benchmarks (a PRIVATE workspace) -> lighthouse 12.8.2 -> puppeteer-core 24.40.0 -> chromium-bidi 14.0.0 -> zod 3.25.76, confirmed with `pnpm why -r zod`, which reports that workspace and no other for 3.x. It never ships to users. No fix exists on the 3.x line: the advisory's only range is {introduced 0, fixed 4.6.6}, and 3.25.76 is the last 3.x release ever published, so the only patched version is a MAJOR bump that chromium-bidi 14.0.0 forbids -- it declares zod ^3.24.1 as a regular dependency and puppeteer-core pins chromium-bidi to exactly 14.0.0. Forcing a `zod@3` override to 4.6.6 would hand chromium-bidi a major it does not declare and break its BiDi message validation at runtime, in exchange for a benchmark-only path; the bump that genuinely removes the path is lighthouse 13 -> puppeteer-core 25 -> chromium-bidi 157, which declares zod ^4.6.5, and that is a benchmark-tooling migration with a re-measurement, not a security patch. The issue is memory exhaustion while validating oversized constrained collections (CWE-770), which needs attacker-controlled input to a zod schema; chromium-bidi validates protocol messages from the Chrome it launched itself. This id ALSO matches the lockfile's second copy of zod, 4.x, reached through @modelcontextprotocol/sdk (a litro-agent devDependency) and the playground's own dependency; that copy is FIXED by the root `zod@4` override to ^4.6.6 and is not what this entry excuses. osv-scanner ignores by id, so dropping that override would be masked by this entry: keep the override, or delete this entry first. Revisit when the benchmarks move to lighthouse 13, which deletes this entry."

