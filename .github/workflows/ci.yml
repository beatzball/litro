name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# No job here uses the token: nothing comments, pushes, or reads an issue.
# Without this block every job would inherit the repository default, which is
# write, and a workflow step would be able to change the repository it is
# testing.
permissions:
  contents: read

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # litro-agent's tests import @beatzball/litro/stream (a framework
      # subpath) as a runtime value; vitest resolves that subpath via the
      # built dist, so the framework (and its own build dep, litro-router)
      # must be built before the suite runs.
      - name: Build litro-router
        run: pnpm --filter litro-router build
      - name: Build framework
        run: pnpm --filter litro build
      # Runs tests in every workspace package that defines a `test` script:
      #   litro-router, litro (framework), create-litro, litro-agent, and
      #   playground (the MCP server's limits, on node:test).
      - name: Run all package tests
        run: pnpm -r test
      # Nothing else type-checks the playground: its MCP server runs on Node's
      # type stripping, which ignores types, so a lib.es2024 call against the
      # repo's ES2022 target ran fine and was caught only by a reviewer.
      - name: Type-check playground MCP server
        run: pnpm --filter playground typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build litro-router
        run: pnpm --filter litro-router build
      - name: Build framework
        run: pnpm --filter litro build
      # Also verifies the cross-platform fs.cpSync recipe-copy step
      - name: Build create-litro
        run: pnpm --filter create-litro build
      - name: Build litro-agent
        run: pnpm --filter litro-agent build
      # `pnpm -r test` runs vitest, which does not type-check. Without this
      # step a type error here reaches `pnpm release` and nothing earlier.
      - name: Build litro-native
        run: pnpm --filter litro-native build

      # Packs each published package and resolves every exports/main/module/
      # types/bin target inside the tarball. The tarball is the point: a target
      # can exist in dist/ here and still be missing from the package, because
      # the `files` allowlist excluded it. @beatzball/litro shipped a `main`
      # and a root `require` condition naming a dist/index.cjs that was never
      # built, through every published version, with every job green.
      - name: Verify export maps (self-test)
        run: node scripts/check-exports.mjs --self-test
      - name: Verify export maps
        run: node scripts/check-exports.mjs

      # The native bridge protocol is written once in TypeScript and mirrored
      # in Swift, because the shell is an installed app and cannot import
      # TypeScript. Two copies drift, and this drift is the expensive kind: a
      # renamed method builds clean, passes both suites, and fails only on a
      # device -- one that updates on the App Store's schedule, not ours.
      - name: Verify bridge protocol parity (self-test)
        run: node scripts/check-bridge-parity.mjs --self-test
      - name: Verify bridge protocol parity
        run: node scripts/check-bridge-parity.mjs

      # Only packages/litro-native/src/adapters/shell.ts may reach the bridge
      # transport. A page that posts to the message handler directly builds
      # clean and works, skipping the handshake, the capability gating and the
      # timeouts, and breaks the day the transport changes.
      - name: Verify the native boundary (self-test)
        run: node scripts/check-native-boundary.mjs --self-test
      - name: Verify the native boundary
        run: node scripts/check-native-boundary.mjs

  # Builds every recipe the way a real user gets it: packed tarballs installed
  # into a fresh scaffold, NOT the workspace symlink every other job uses.
  #
  # This exists because a scaffolded app was blank for weeks while every job
  # here stayed green. Vite 8 does not transpile TypeScript inside node_modules,
  # so resolving the package to its src/ emitted raw decorators the browser
  # cannot parse -- while the build still exited 0 and the prerendered HTML was
  # still perfect. Parsing the emitted bundle is the check that catches it.
  scaffolded-apps:
    name: Scaffolded Apps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build litro-router
        run: pnpm --filter litro-router build
      - name: Build framework
        run: pnpm --filter litro build
      - name: Build litro-agent
        run: pnpm --filter litro-agent build
      # `pnpm -r test` runs vitest, which does not type-check. Without this
      # step a type error here reaches `pnpm release` and nothing earlier.
      - name: Build litro-native
        run: pnpm --filter litro-native build
      - name: Build create-litro
        run: pnpm --filter create-litro build
      - name: Scaffold every recipe from packed tarballs and parse each bundle
        run: node scripts/verify-scaffolded-apps.mjs

  # Issue 218: the published scaffolder printed "no recipes available" because
  # it imported each recipe config by absolute path, which Node rejects on
  # Windows (and on any OS when the path holds a `#`). Every other job runs on
  # Linux from a plain temp path, so none of them could see it. This one runs
  # the packed CLI on Windows too, from a folder named `C# 100%20 litro`.
  create-litro-packed:
    name: create-litro packed (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build litro-router
        run: pnpm --filter litro-router build
      - name: Build framework
        run: pnpm --filter litro build
      - name: Build create-litro
        run: pnpm --filter create-litro build
      - name: Run the packed scaffolder from a path with URL syntax in it
        run: node scripts/verify-create-litro-packed.mjs

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build litro-router
        run: pnpm --filter litro-router build
      - name: Build framework
        run: pnpm --filter litro build
      # The agent playgrounds import @beatzball/litro-agent/dist/plugin.js in
      # their nitro.config.ts, so the package must be built for e2e.
      - name: Build litro-agent
        run: pnpm --filter litro-agent build
      # `pnpm -r test` runs vitest, which does not type-check. Without this
      # step a type error here reaches `pnpm release` and nothing earlier.
      - name: Build litro-native
        run: pnpm --filter litro-native build
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: Run E2E tests (dev mode)
        run: pnpm test:e2e

  build-docs-ssr:
    name: Build docs-ssr
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build litro-router
        run: pnpm --filter litro-router build
      - name: Build framework
        run: pnpm --filter litro build
      - name: Re-link bins
        run: pnpm install --frozen-lockfile
      - name: Build docs-ssr
        run: pnpm --filter @beatzball/litro-docs-ssr build
      - name: Verify server entry exists
        run: test -f docs-ssr/dist/server/server/index.mjs
      - name: Verify every <litro-link> serves a real anchor
        run: node scripts/check-ssr-links.mjs

  doc-refs:
    name: Doc References
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Pure Node, no dependencies and no install: the checker reads Markdown
      # and TypeScript source directly. It fails the build when docs cite a
      # repo path, a package export, or a custom element that does not exist.
      - name: Self-test the checker
        run: node scripts/check-doc-refs.mjs --self-test
      - name: Check documentation references
        run: node scripts/check-doc-refs.mjs
      # Same shape: pure Node, no install. Fails on common British spellings,
      # because the repo is written in American English.
      - name: Self-test the spelling check
        run: node scripts/check-spelling.mjs --self-test
      - name: Check spelling
        run: node scripts/check-spelling.mjs
      # Same shape again: fails when an HTML comment sits inside an html``
      # template, because every byte of one is served to every reader. The
      # prose belongs in a TypeScript comment beside the template.
      - name: Self-test the HTML comment check
        run: node scripts/check-html-comments.mjs --self-test
      - name: Check for HTML comments in templates
        run: node scripts/check-html-comments.mjs
      # Same shape: a lint, not a proof of safety. Fails when a catch-all
      # handler's 404 template has an interpolation that is not one
      # escapeHtml() call, builds HTML in a way the lint cannot follow, or
      # carries a copy of escapeHtml() that differs from the canonical one
      # (issue 295). The behavioral check is create-litro's
      # catch-all-handler.test.ts, which runs every handler.
      - name: Self-test the catch-all escape lint
        run: node scripts/check-catch-all-escape.mjs --self-test
      - name: Lint catch-all 404 pages for the escapeHtml() shape
        run: node scripts/check-catch-all-escape.mjs
      # Guards the e2e suite against one spec deleting state a concurrently
      # running dev server is using -- the issue #118 failure mode. Pure Node
      # like the checker above, so it belongs in this install-free job.
      - name: Check e2e isolation
        run: node scripts/check-e2e-isolation.mjs

  # The native shell's Swift half. A macOS runner, because nothing else has
  # Xcode on it.
  #
  # The protocol and the app configuration are pure Foundation, so `swift test`
  # covers them with no simulator. The app target is then built for the
  # simulator, which is what proves the Xcode project and the selection script
  # still produce something that compiles -- a test suite alone would not.
  native:
    name: Native shell
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # Printed because this runner's Swift is usually OLDER than a current
      # Mac's, and the older one is stricter about main-actor isolation. A
      # failure here that does not reproduce locally is almost always that
      # difference; see NATIVE-009 in .agents/rules/native-shell.md.
      - name: Show the toolchain
        run: |
          xcodebuild -version
          swift --version

      # Every rule of the bridge protocol, and the origin policy, with no
      # simulator and no signing.
      - name: Test the bridge and the shell kit
        run: swift test --package-path native

      # A typo in an app name must stop the build rather than produce a shell
      # with the wrong app inside it.
      - name: Reject an unknown app
        run: |
          if native/scripts/select-app.sh no-such-app; then
            echo "select-app accepted an app that does not exist" >&2
            exit 1
          fi

      - name: Select the demo app
        run: native/scripts/select-app.sh demo

      # The release guard's own rules. It only ever runs during a Release
      # build, which CI does not do and a person does once, so without this
      # the rules would go years without being exercised.
      - name: Check the release guard's rules
        run: native/scripts/check-release-config.sh --self-test

      # What an app folder must hold, and what is left out of the bundle.
      - name: Check the app selection rules
        run: native/scripts/select-app.sh --self-test

      - name: Build the app for the simulator
        run: |
          xcodebuild build \
            -project native/LitroShell.xcodeproj \
            -scheme LitroShell \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

      # The local-networking keys are Debug only, and the only place that is
      # visible is the BUILT Info.plist. Apple lists NSAllowsLocalNetworking
      # among the App Transport Security keys that need a written justification
      # at review, so one shipping by accident is a reviewer question on every
      # submission from every app built on this shell.
      #
      # Both halves are asserted. A Debug build missing them is a dev server
      # that will not load; a Release build carrying them is the review
      # problem. One without the other would pass if the preprocessor flag
      # stopped working in either direction.
      - name: Keep the local-networking keys out of a release build
        run: |
          debug_plist=$(find "$HOME/Library/Developer/Xcode/DerivedData" -name Info.plist \
            -path '*Debug-iphonesimulator/demo.app/*' 2>/dev/null | head -1)
          if [ -z "$debug_plist" ]; then
            echo "could not find the Debug Info.plist the previous step built" >&2
            exit 1
          fi
          for key in NSAppTransportSecurity NSLocalNetworkUsageDescription; do
            if ! plutil -extract "$key" raw -o - "$debug_plist" >/dev/null 2>&1; then
              echo "the Debug build is missing $key, so a dev server cannot load" >&2
              exit 1
            fi
          done
          echo "Debug carries both keys, as it must"

          # A Release build needs a shippable app, because the release guard
          # refuses the demo on purpose. qdoku is one: an https origin and an
          # icon. Its Release build passing is also the proof that a real app
          # gets through the guard, rather than a patched demo.
          native/scripts/select-app.sh qdoku

          xcodebuild build \
            -project native/LitroShell.xcodeproj \
            -scheme LitroShell \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath release-dd \
            CODE_SIGNING_ALLOWED=NO > release-plist.log 2>&1 \
            || { echo "the Release build failed"; tail -40 release-plist.log; exit 1; }

          release_plist=release-dd/Build/Products/Release-iphonesimulator/qdoku.app/Info.plist
          plutil -lint "$release_plist"
          for key in NSAppTransportSecurity NSLocalNetworkUsageDescription; do
            if plutil -extract "$key" raw -o - "$release_plist" >/dev/null 2>&1; then
              echo "$key shipped in a Release build; it needs a justification at review" >&2
              exit 1
            fi
          done
          echo "Release carries neither key, as it must"

          # The icon was compiled from the catalog select-app copied into
          # Build/Resources, and the export-compliance answer is there.
          icon=$(plutil -extract CFBundleIcons.CFBundlePrimaryIcon.CFBundleIconName raw -o - "$release_plist")
          [ "$icon" = "AppIcon" ] || { echo "the Release build has no app icon (got '$icon')" >&2; exit 1; }
          [ -f release-dd/Build/Products/Release-iphonesimulator/qdoku.app/Assets.car ] \
            || { echo "no compiled asset catalog in the Release build" >&2; exit 1; }
          encryption=$(plutil -extract ITSAppUsesNonExemptEncryption raw -o - "$release_plist")
          [ "$encryption" = "false" ] || { echo "ITSAppUsesNonExemptEncryption is '$encryption'" >&2; exit 1; }
          echo "Release has its icon and its encryption answer"

          # The identity in the product is the one app.json asks for. Nothing
          # else here would notice if it were not: a Release build with the
          # wrong bundle identifier and no version or build number at all still
          # succeeds, and every check above still passes. The bundled app.json
          # is the one the shell reads its start URL from at launch.
          app_json=native/Apps/qdoku/app.json
          same_as_app_json() { # <Info.plist key> <app.json key>
            want=$(plutil -extract "$2" raw -o - "$app_json" 2>/dev/null || true)
            got=$(plutil -extract "$1" raw -o - "$release_plist" 2>/dev/null || true)
            # Empty on both sides would compare equal and prove nothing.
            [ -n "$want" ] || { echo "app.json has no $2 to compare" >&2; exit 1; }
            [ "$got" = "$want" ] || { echo "$1 is '$got', but app.json says '$want'" >&2; exit 1; }
          }
          same_as_app_json CFBundleIdentifier bundleIdentifier
          same_as_app_json CFBundleShortVersionString version
          same_as_app_json CFBundleVersion build
          cmp -s "$app_json" release-dd/Build/Products/Release-iphonesimulator/qdoku.app/app.json \
            || { echo "the bundled app.json is not qdoku's" >&2; exit 1; }
          echo "Release carries the identity app.json asks for"

          # Put the development configuration back for the step after this one.
          native/scripts/select-app.sh demo

      # The demo app is a development app: it starts at localhost, which is
      # exactly what must not reach a submission. A Release build of it has to
      # fail, and it failing here is what proves the guard is wired to the
      # project rather than merely present in the repository.
      - name: Refuse a release build of a development app
        run: |
          if xcodebuild build \
            -project native/LitroShell.xcodeproj \
            -scheme LitroShell \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO > release-attempt.log 2>&1; then
            echo "a Release build of the demo app succeeded; the guard did not run" >&2
            exit 1
          fi
          if ! grep -q "localhost on a device is the device itself" release-attempt.log; then
            echo "the Release build failed, but not for the reason the guard gives" >&2
            tail -40 release-attempt.log >&2
            exit 1
          fi
          if ! grep -q "allowedOrigins has" release-attempt.log; then
            echo "the guard refused the start URL but never read allowedOrigins" >&2
            tail -40 release-attempt.log >&2
            exit 1
          fi
          if ! grep -q "the app has no icon" release-attempt.log; then
            echo "the guard did not refuse an app with no icon" >&2
            tail -40 release-attempt.log >&2
            exit 1
          fi
          echo "the guard refused it, as it should"

  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # osv-scanner is a standalone binary that scans the checked-in lockfiles
      # directly — it needs neither Node nor pnpm. A setup-node step with
      # `cache: pnpm` but no `pnpm install` leaves the pnpm store path empty
      # and fails at post-run cache-save on the current runners, so this job
      # deliberately has no setup-node/pnpm steps.
      #
      # npm retired the audit endpoint `pnpm audit` calls (HTTP 410), so audit
      # via osv-scanner instead: it scans the lockfile against the OSV database
      # with no dependency on that endpoint. Baseline/ignore rules (each with a
      # documented reason) live in osv-scanner.toml at the repo root; a new
      # advisory, or any high/critical advisory in a shipped runtime
      # dependency, is not ignored there and fails this check.
      #
      # EVERY checked-in lockfile is scanned, not just pnpm-lock.yaml. The six
      # npm comparison apps under benchmarks/apps/ are outside the pnpm
      # workspace and carry their own package-lock.json, so for as long as this
      # job named one lockfile they were never audited at all — they had
      # accumulated three Critical and five High advisories that no CI job
      # would ever have reported. Add a lockfile here whenever one is added to
      # the repo; `git ls-files | grep -E 'lock\.(json|yaml)$'` is the list.
      - name: Install osv-scanner
        run: |
          curl -sSfL https://github.com/google/osv-scanner/releases/download/v2.4.0/osv-scanner_linux_amd64 -o osv-scanner
          chmod +x osv-scanner
          ./osv-scanner --version
      - name: Audit dependencies
        run: |
          ./osv-scanner scan source --config osv-scanner.toml \
            --lockfile pnpm-lock.yaml \
            --lockfile benchmarks/apps/nextjs/package-lock.json \
            --lockfile benchmarks/apps/nuxt/package-lock.json \
            --lockfile benchmarks/apps/hn-nextjs/package-lock.json \
            --lockfile benchmarks/apps/hn-nuxt/package-lock.json \
            --lockfile benchmarks/apps/tanstack/package-lock.json \
            --lockfile benchmarks/apps/hn-tanstack/package-lock.json
