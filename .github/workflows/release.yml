name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # Required for npm trusted publishing (OIDC) — no NPM_TOKEN involved.
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      # No registry-url here: setup-node would write an .npmrc referencing
      # ${NODE_AUTH_TOKEN}, and npm errors on undefined env vars in config.
      # OIDC trusted publishing needs no auth config at all.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # npm trusted publishing (OIDC) needs npm >= 11.5.1; the npm bundled with
      # Node 24 can lag that. Pin the 11.x line explicitly to guarantee an
      # OIDC-capable npm without tracking npm@latest (12.x), which couples the
      # pipeline to specific Node minors — keeping this decoupled from the
      # runtime pin above.
      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@^11 && npm --version

      - run: pnpm install --frozen-lockfile

      # Publishing authenticates via OIDC trusted publishers configured on the
      # npm packages (repo beatzball/litro, workflow release.yml) — deliberately
      # no NPM_TOKEN/NODE_AUTH_TOKEN so npm cannot fall back to token auth.
      - name: Create Release PR or Publish
        uses: changesets/action@v1
        with:
          publish: pnpm release
          version: pnpm version-packages
          title: "chore: version packages"
          commit: "chore: version packages"
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
