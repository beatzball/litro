# osv-scanner configuration for the Dependency Audit CI check.
#
# Replaces `pnpm audit --audit-level high`, whose npm endpoint npm retired
# (HTTP 410). osv-scanner scans the lockfile against the OSV database with no
# dependency on that endpoint.
#
# The entries below baseline the advisories present when this gate was
# introduced. Each is either a dev/tooling dependency that is NOT shipped in
# any published @beatzball package, or a transitive advisory below the `high`
# severity bar the previous audit enforced. A NEW advisory — or any high/
# critical advisory in a shipped runtime dependency — is not listed here and
# will fail the check. Provenance verified: of these packages only nitropack
# is a direct production dependency of a published package (@beatzball/litro),
# and its advisories are Medium, below the enforced high threshold.

# --- Dev / tooling only (never shipped to users) ---

[[IgnoredVulns]]
id = "GHSA-5xrq-8626-4rwp" # vitest 2.1.9 (Critical)
reason = "vitest is a dev/test-only dependency; not a production dependency of any published @beatzball package, so it never ships to users."

[[IgnoredVulns]]
id = "GHSA-g7r4-m6w7-qqqr" # esbuild 0.27.3
reason = "esbuild is a dev/build-only tool (via vite/vitest); not shipped in any published package."

[[IgnoredVulns]]
id = "GHSA-w5hq-g745-h8pq" # uuid 8.3.2 (High)
reason = "uuid is a dev/benchmark transitive dependency; not a production dependency of any published package, so it never ships to users."

