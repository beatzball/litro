id = "GHSA-qqmp-wf37-98f9" # @opentelemetry/instrumentation-* 0.18.1 - 0.51.1 (Medium, CVSS 5.8)
reason = "Medium severity, below the high threshold this audit enforces, and dev/benchmark-only. One advisory covers six installed packages (instrumentation-knex, -mongoose, -mysql, -mysql2, -pg, -tedious); `pnpm why -r @opentelemetry/instrumentation-pg` reports a single path for all of them, @beatzball/litro-benchmarks (a PRIVATE workspace) -> lighthouse 12.8.2 -> @sentry/node 9.47.1, so none of them ships to users. The issue is an unconditional `db.user` span attribute (CWE-532, information exposure through a log), which needs a database instrumented through @sentry/node to matter; this repo instruments no database. Each package has a fixed release, but every one is a MAJOR-series jump pinned by @sentry/node 9.47.1, so six overrides would fight that pin for a Medium in a private benchmark workspace. Revisit when @sentry/node bumps its OpenTelemetry instrumentation range."

# --- Production path, no upstream fix (NOT dev-only) ---
#
# Read the reason below before adding anything to this section. It is the only
# place in this file where a filtered advisory does reach a user, and it is
# filtered because there is nothing to bump to — not because it is harmless.

[[IgnoredVulns]]
id = "GHSA-86w9-cpqp-85rv" # node-forge 1.4.0 (High, CVSS 8.7)
reason = "No fixed version exists upstream as of 2026-10-02: node-forge 1.4.0 IS the latest published release, and the advisory lists no patched version (last_affected 1.4.0, no fixed event). This entry is NOT dev-only, unlike the others above: node-forge reaches published packages as a transitive PRODUCTION dependency. `pnpm why --prod node-forge --filter @beatzball/litro` reports @beatzball/litro -> nitropack 2.13.4 -> listhen 1.10.0 -> node-forge 1.4.0, and @beatzball/litro-agent reaches it by the same path. No bump removes the path: nitropack 2.13.4 is the current `latest` tag, and listhen 1.10.1 (latest) still declares node-forge ^1.4.0; Nitro v3 is deferred while it is still beta, so it is not the route here. Exposure is limited, with evidence: the advisory is RSA PKCS#1 v1.5 signature VERIFICATION forgery (CWE-347), and listhen uses node-forge only to generate and sign a self-signed certificate for the dev server's HTTPS option — there is no `verify` call anywhere in listhen's built output, so the vulnerable path is never entered — while a production `litro build` emits a Nitro server that references neither node-forge nor listhen and does not list node-forge in its generated runtime dependencies. Tracked in issue 229, which carries the full assessment. Since the audit began scanning every checked-in lockfile, this id also matches the two npm Nuxt comparison apps under benchmarks/apps/, where it arrives through nuxt rather than nitropack; both are PRIVATE benchmark apps that are never published or deployed, and no bump removes it there either. Revisit when node-forge ships a fix, or when listhen or nitropack drops the dependency."

# --- Matched by a range the advisory itself contradicts ---
#
# This section is not a judgment call about exposure, and it is not a deferral.
# The entry here is an advisory whose own data says we are already on the fixed
# version, matched anyway because its machine-readable range omits an upper
# bound. Nothing can be bumped to, because nothing is wrong with what we have.
#
# Keep this section for that one shape only. If an advisory genuinely affects
# the version in the lockfile, it belongs in one of the sections above, or it
# belongs fixed. Verify the ranges against `https://api.osv.dev/v1/vulns/<id>`
# before adding anything here, and quote what you found in the reason.

[[IgnoredVulns]]
id = "GHSA-vjh5-4x84-xrqp" # nuxt + @nuxt/nitro-server 4.6.2 (Medium, CVSS_V4 6.9) -- already on the fixed version
reason = "We are ON the version this advisory names as fixed. It records two SEMVER ranges per affected package, one per release line, and only the 4.x one carries a `fixed` event: nuxt gets {introduced 4.0.0, fixed 4.6.2} and {introduced 3.0.0} with no fixed event, and @nuxt/nitro-server gets {introduced 4.2.0, fixed 4.6.2} and {introduced 3.20.0} with no fixed event. The 3.x ranges are meant to stop below 4.0.0 -- the advisory says so itself, in `database_specific.last_known_affected_version_range: < 4.0.0` on both -- but that field is prose that osv-scanner does not use for matching, so the open-ended 3.x range swallows every later version, 4.6.2 included. Both lockfiles resolve 4.6.2, which is `latest` on npm and the newest release in the 4.x line, so there is no version to move to and no exposure to accept: the match is an artifact of the advisory's range data, not of our dependencies. Only the two npm Nuxt comparison apps under benchmarks/apps/ pull nuxt at all; it is absent from pnpm-lock.yaml and from every published @beatzball package. Revisit when GitHub closes the 3.x range (then this entry stops matching and must be deleted), or when a 4.6.3+ release makes it moot."
