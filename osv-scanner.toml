reason = "Fixed in vite 8.1.6, which Litro cannot take until issue 236 lands (Vite 8.1+ silently breaks Lit hydration; see the section comment above for the measurements). The advisory is an inlined launch-editor `fs.existsSync()` existence check that can be bypassed on WINDOWS ONLY, reached through the Vite dev server's click-to-open-in-editor path. vite is a direct production dependency of @beatzball/litro, so this is not dev-only by install, but it is dev-server-only by code path: the framework imports vite from its CLI, its Vite plugin and its dev-server modules, and a deployed Litro app (a Nitro server emitted by `litro build`) never starts a Vite dev server. Revisit by landing issue 236 and unpinning vite to ^8.1.6, which deletes this entry."

