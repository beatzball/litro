# osv-scanner configuration for the Dependency Audit CI check.
#
# The job scans EVERY checked-in lockfile against this one config: the
# workspace's pnpm-lock.yaml plus the four package-lock.json files of the npm
# comparison apps under benchmarks/apps/. An id below may therefore be matched
# from more than one lockfile, by more than one dependency path; where that is
# true the reason says so.
#
# Replaces `pnpm audit --audit-level high`, whose npm endpoint npm retired
# (HTTP 410). osv-scanner scans the lockfile against the OSV database with no
# dependency on that endpoint.
#
# Fixable advisories are FIXED, not listed here. js-yaml GHSA-2883-xcg3-v3hh
# was resolved by bumping the existing pnpm overrides to ^3.15.2 / ^4.3.2 — a
# patch on each line — rather than adding two more entries below.
#
# The entries below baseline the advisories present when this gate was
# introduced. Most are either a dev/tooling dependency that is NOT shipped in
# any published @beatzball package, or a transitive advisory below the `high`
# severity bar the previous audit enforced. A NEW advisory is not listed here
# and will fail the check.
#
# TWO entries do not fit either reason: node-forge GHSA-86w9-cpqp-85rv and
# braces GHSA-vfj7-8cjw-p6xm are both High AND reach published packages in
# production. They share a section at the bottom, each with its own
# justification and tracking issue, so that "dev-only" never has to be claimed
# about a package that ships. Keep that distinction: an entry whose reason is
# not true is worse than no gate at all.

# --- Dev / tooling only (never shipped to users) ---

